[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cassette"
version = "0.1.0"
description = "Record and replay LLM API calls for deterministic, offline agent-harness tests: VCR for chat completions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gang Ji" }]
keywords = ["llm", "testing", "agents", "harness", "mocking", "replay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
llm-cassette = "llm_cassette.cli:main"

[project.urls]
Homepage = "https://github.com/gangjig/llm-cassette"
Repository = "https://github.com/gangjig/llm-cassette"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
